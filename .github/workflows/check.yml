name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS is in the matrix on purpose: its /tmp sits under a symlink and its sed, grep and awk
    # are BSD, which is exactly what tools/check.sh was written to survive.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # v5 runs on Node 24; v4's Node 20 runtime is deprecated on the runners. The job only reads the
      # tree, so the token is not left in .git/config for the steps that follow.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: make check
        run: make check
      - name: make test
        run: make test
